name: "PokéBonk research: REA signals + balance lab"

on:
  workflow_dispatch:
    inputs:
      enemy_speed:
        description: "Synthetic enemy speed factor (0.5-2)"
        type: string
        default: "1.20"
      spawn_frequency:
        description: "Synthetic enemy spawn factor (0.5-2)"
        type: string
        default: "1.15"
      xp_cost:
        description: "Synthetic XP requirement factor (0.5-2)"
        type: string
        default: "1.25"
      trials:
        description: "Matched-seed trials (5-200)"
        type: string
        default: "40"
  push:
    branches: [main, analysis/pokebonk-balance-lab, analysis/pokebonk-mechanics-evidence]
    paths:
      - .github/workflows/pokebonk-balance-lab.yml
      - experiments/pokebonk/lab/**

permissions:
  contents: read

concurrency:
  group: pokebonk-balance-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: REA cloud signals + independent balance simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CDP_URL: http://127.0.0.1:9222
      ENEMY_SPEED: ${{ inputs.enemy_speed || '1.20' }}
      SPAWN_FREQUENCY: ${{ inputs.spawn_frequency || '1.15' }}
      XP_COST: ${{ inputs.xp_cost || '1.25' }}
      TRIALS: ${{ inputs.trials || '40' }}
    steps:
      - name: Checkout lab scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"

      - name: Run independent synthetic balance comparisons
        shell: bash
        run: |
          set -euo pipefail
          node experiments/pokebonk/lab/balance_sim.mjs \
            --enemy-speed "$ENEMY_SPEED" --spawn-frequency "$SPAWN_FREQUENCY" \
            --xp-cost "$XP_COST" --trials "$TRIALS" \
            --output "$RUNNER_TEMP/synthetic-balance-safe.json"

      - name: Verify preinstalled Chrome and install pinned REA
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          google-chrome --version
          npm install --global rea-agents@6.7.0 --no-audit --no-fund
          rea --version

      - name: Launch isolated headless Chrome on loopback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pokebonk-chrome-profile"
          google-chrome --headless=new --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check --disable-extensions \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/pokebonk-chrome-profile" \
            https://pokebonk.com/ > "$RUNNER_TEMP/chrome-output.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/chrome.pid"
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 2 "$CDP_URL/json/list" > "$RUNNER_TEMP/browser-targets.json"; then
              if python3 - "$RUNNER_TEMP/browser-targets.json" <<'PY'
          import json, sys, urllib.parse
          with open(sys.argv[1], encoding="utf-8") as f:
              targets = json.load(f)
          valid = any(t.get("type") == "page" and urllib.parse.urlsplit(t.get("url","")).scheme == "https" and urllib.parse.urlsplit(t.get("url","")).hostname == "pokebonk.com" for t in targets)
          sys.exit(0 if valid else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            echo "Browser target was not available after the startup window." >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/browser-targets.json" "$GITHUB_ENV" <<'PY'
          import json, sys, urllib.parse
          with open(sys.argv[1], encoding="utf-8") as f:
              targets = json.load(f)
          for target in targets:
              url = urllib.parse.urlsplit(target.get("url", ""))
              if target.get("type") == "page" and url.scheme == "https" and url.hostname == "pokebonk.com":
                  with open(sys.argv[2], "a", encoding="utf-8") as out:
                      out.write("TARGET_ID=" + target["id"] + "\n")
                  break
          else:
              sys.exit("Allowed PokéBonk page not found.")
          PY
          echo "Dedicated Chrome started and PokéBonk browser target detected."

      - name: REA passive investigation (no automation, no site code in public logs)
        shell: bash
        run: |
          set -euo pipefail
          if ! rea list-browser-targets "$CDP_URL" --json > "$RUNNER_TEMP/rea-targets.json" 2> "$RUNNER_TEMP/rea-error.log"; then
            echo "REA target discovery failed; raw diagnostics not printed in public logs." >&2
            exit 1
          fi
          if ! rea inspect-web-page "$CDP_URL" "$TARGET_ID" --observation-ms 1000 --include-script-sources --json > "$RUNNER_TEMP/rea-inspection.json" 2> "$RUNNER_TEMP/rea-error.log"; then
            echo "REA page inspection failed; raw diagnostics not printed in public logs." >&2
            exit 1
          fi
          bundle_status="passed"
          if ! rea analyze-web-bundle "$CDP_URL" "$TARGET_ID" --json > "$RUNNER_TEMP/rea-bundle.json" 2> "$RUNNER_TEMP/rea-error.log"; then
            bundle_status="unavailable"
          fi
          BUNDLE_STATUS="$bundle_status" python3 - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          items = [("Page target discovery", "rea-targets.json"), ("REA page inspection", "rea-inspection.json")]
          if os.environ["BUNDLE_STATUS"] == "passed":
              items.append(("REA JavaScript bundle assessment", "rea-bundle.json"))
          lines = ["## PokéBonk REA + independent balance research", "",
                   "- Runtime: GitHub-hosted standard Ubuntu runner",
                   "- REA: official published 6.7.0 CLI",
                   "- Target: https://pokebonk.com/ (one browser session)",
                   "- Gameplay automated: **no**",
                   "- Raw web sources, cookies, and logs uploaded: **no**", ""]
          for title, name in items:
              path = temp / name
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
                  valid = isinstance(value, (dict, list))
                  lines.append(f"- {title}: **{'JSON received' if valid else 'unexpected JSON type'}** ({path.stat().st_size} bytes, private temporary file)")
              except (ValueError, OSError):
                  lines.append(f"- {title}: **no valid JSON**")
                  raise SystemExit("REA returned invalid JSON; raw output kept out of logs.")
          if os.environ["BUNDLE_STATUS"] != "passed":
              lines.append("- REA JavaScript bundle assessment: **not available** (investigate separately)")
          lines += ["", "This run confirms limited passive capability only. It does not prove game logic, rendering details, or server internals."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("REA inspection succeeded. Sanitized summary was written; raw observations were not uploaded.")
          PY

      - name: Aggregate local JS source signals without publishing code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-js-files"
          if ! timeout 180s rea export-web-scripts "$RUNNER_TEMP/rea-inspection.json" \
              "$RUNNER_TEMP/rea-exported-js" --json \
              > "$RUNNER_TEMP/rea-export-private.json" 2> "$RUNNER_TEMP/rea-export-errors-private.log"; then
            echo "REA script export unavailable, counting only any successfully retained scripts."
          fi
          exported="$RUNNER_TEMP/rea-exported-js/files"
          if [[ ! -d "$exported" ]]; then exported="$RUNNER_TEMP/empty-js-files"; fi
          node experiments/pokebonk/lab/source_signals.mjs "$exported" "$RUNNER_TEMP/source-signals-safe.json"
          echo "Only aggregate lexical counts are included in this report."

      - name: Inspect static mechanics candidate structures (no raw source upload)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pokebonk-ast-deps" --ignore-scripts --no-audit --no-fund acorn@8.15.0 acorn-walk@8.3.4 > /dev/null
          node --check experiments/pokebonk/lab/evidence_map.mjs
          exported="$RUNNER_TEMP/rea-exported-js/files"
          if [[ ! -d "$exported" ]]; then exported="$RUNNER_TEMP/empty-js-files"; fi
          node experiments/pokebonk/lab/evidence_map.mjs "$exported" \
            "$RUNNER_TEMP/mechanics-candidates-safe.json" "$RUNNER_TEMP/pokebonk-ast-deps"
          echo "The structural report contains only aggregate counts, hashed pointers and operator counts."

      - name: Store sanitized metrics only
        uses: actions/upload-artifact@v4
        with:
          name: pokebonk-aggregate-and-synthetic-only
          path: |
            ${{ runner.temp }}/synthetic-balance-safe.json
            ${{ runner.temp }}/source-signals-safe.json
            ${{ runner.temp }}/mechanics-candidates-safe.json
          retention-days: 7
          if-no-files-found: error

      - name: Close dedicated browser
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/chrome.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/chrome.pid")" 2>/dev/null || true
          fi
