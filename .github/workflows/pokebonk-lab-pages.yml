name: "Publish PokéBonk independent balance lab (public site)"

on:
  workflow_dispatch:
  push:
    branches: [main, site/pokebonk-balance-pages]
    paths:
      - .github/workflows/pokebonk-lab-pages.yml
      - experiments/pokebonk/lab/balance_lab.html
      - experiments/pokebonk/lab/lab_smoke.mjs

permissions:
  contents: read

concurrency:
  group: pokebonk-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Test and package public-only HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - name: Test offline lab and reject remote scripts or networking
        shell: bash
        run: |
          set -euo pipefail
          node experiments/pokebonk/lab/lab_smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          src = Path("experiments/pokebonk/lab/balance_lab.html").read_text("utf-8")
          assert "<html" in src and "</html>" in src
          assert "独立シミュレーター" in src
          forbidden = ("<script src=", "<iframe", "<object", "<embed", "fetch(", "XMLHttpRequest", "WebSocket(", "http://", "https://")
          assert not any(token.lower() in src.lower() for token in forbidden), "Public site contains unexpected embedded external resource or networking"
          print("Public HTML privacy check passed.")
          PY
      - name: Stage exactly two public website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-public"
          cp experiments/pokebonk/lab/balance_lab.html "$RUNNER_TEMP/pages-public/index.html"
          touch "$RUNNER_TEMP/pages-public/.nojekyll"
          echo "Public Pages payload is a standalone HTML page and .nojekyll only."
      - name: Upload Pages deployment bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-public
          retention-days: 1

  deploy:
    name: Deploy independent lab to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
